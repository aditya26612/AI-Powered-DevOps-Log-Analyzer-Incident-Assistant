# Test environment properties for log-layer unit & integration tests
spring.application.name=log-layer-test
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/log_layer_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.enabled=false
diagnosis.enabled=false

internal.api-key=${INTERNAL_API_KEY:test_internal_api_key_32_chars_min!}
jwt.secret=${JWT_SECRET:test_jwt_secret_must_be_at_least_32_characters_long_for_hmac_sha256}

notification.auto-diagnose-anomalies=true
notification.slack.enabled=false
notification.email.enabled=false
