# ==============================
# Application
# ==============================
spring.application.name=log-layer

# ==============================
# Server
# ==============================
server.port=8082

# ==============================
# ML Service
# ==============================
ml.service.base-url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.predict-endpoint=/api/v1/predict
ml.service.health-endpoint=/api/v1/system/health
ml.service.train-endpoint=/api/v1/train
ml.service.timeout=5s
ml.service.retry-count=3
internal.api-key=${INTERNAL_API_KEY:}

# ==============================
# PostgreSQL
# ==============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/log_layer_db
spring.datasource.username=${LOG_LAYER_DB_USERNAME:devinsight_log_app}
spring.datasource.password=${LOG_LAYER_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================
# Flyway
# ==============================
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# ==============================
# Jackson
# ==============================
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# ==============================
# Logging
# ==============================
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.web=INFO


# ==============================
# LLM Service
# ==============================
llm.service.base-url=${LLM_SERVICE_URL:http://localhost:8084}
llm.service.analyze-endpoint=/api/v1/llm/analyze
llm.service.timeout=60s

# ==============================
# Alert & Notification
# ==============================
notification.auto-diagnose-anomalies=${NOTIFICATION_AUTO_DIAGNOSE:true}
notification.slack.enabled=${NOTIFICATION_SLACK_ENABLED:false}
notification.slack.webhook-url=${NOTIFICATION_SLACK_WEBHOOK_URL:}
notification.slack.channel=${NOTIFICATION_SLACK_CHANNEL:#all-devinsight}
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}
notification.email.to=${NOTIFICATION_EMAIL_TO:}

tenant.runtime.guard=true

# Stage 04 optional Kafka ingestion
devinsight.kafka.enabled=${DEVINSIGHT_KAFKA_ENABLED:false}
devinsight.kafka.producer-enabled=${DEVINSIGHT_KAFKA_PRODUCER_ENABLED:true}
devinsight.kafka.consumer-enabled=${DEVINSIGHT_KAFKA_CONSUMER_ENABLED:true}
devinsight.kafka.bootstrap=${DEVINSIGHT_KAFKA_BOOTSTRAP:127.0.0.1:19092}
devinsight.kafka.security-protocol=${DEVINSIGHT_KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
devinsight.kafka.mechanism=${DEVINSIGHT_KAFKA_MECHANISM:PLAIN}
devinsight.kafka.producer-username=${DEVINSIGHT_KAFKA_PRODUCER_USERNAME:}
devinsight.kafka.producer-password=${DEVINSIGHT_KAFKA_PRODUCER_PASSWORD:}
devinsight.kafka.consumer-username=${DEVINSIGHT_KAFKA_CONSUMER_USERNAME:}
devinsight.kafka.consumer-password=${DEVINSIGHT_KAFKA_CONSUMER_PASSWORD:}
devinsight.kafka.raw-topic=${DEVINSIGHT_KAFKA_RAW_TOPIC:devinsight.logs.raw.v1}
devinsight.kafka.dead-letter-topic=${DEVINSIGHT_KAFKA_DLQ_TOPIC:devinsight.logs.dlq.v1}
devinsight.kafka.group=${DEVINSIGHT_KAFKA_GROUP:devinsight.logs.worker.v1}
devinsight.kafka.concurrency=${DEVINSIGHT_KAFKA_CONCURRENCY:1}
devinsight.kafka.publish-timeout-ms=${DEVINSIGHT_KAFKA_PUBLISH_TIMEOUT_MS:5000}
devinsight.kafka.max-backlog=${DEVINSIGHT_KAFKA_MAX_BACKLOG:200}
devinsight.kafka.attempts=${DEVINSIGHT_KAFKA_ATTEMPTS:3}
devinsight.kafka.pause-ms=${DEVINSIGHT_KAFKA_PAUSE_MS:5000}
