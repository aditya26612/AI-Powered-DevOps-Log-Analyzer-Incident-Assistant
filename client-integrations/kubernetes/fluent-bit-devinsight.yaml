apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-devinsight-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            docker
        Tag               kube.*
        Refresh_Interval  5
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Merge_Log           On
        Keep_Log            Off

    [OUTPUT]
        Name          http
        Match         kube.*
        Host          api-gateway.devinsight.svc.cluster.local
        Port          8080
        URI           /api/v1/logs
        Header        Content-Type application/json
        Header        X-API-Key devinsight_internal_ml_key_secret_12345
        Format        json

