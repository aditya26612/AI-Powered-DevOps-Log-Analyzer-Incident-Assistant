# ==============================
# Application
# ==============================
spring.application.name=demoUserService

# ==============================
# Server
# ==============================
server.port=8081

# ==============================
# PostgreSQL
# ==============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/devinsight
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}

# ==============================
# JPA
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ==============================
# JWT
# ==============================
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000


logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG

# Minimal operational health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Enable only after deliberate baselining or for a verified empty database.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
