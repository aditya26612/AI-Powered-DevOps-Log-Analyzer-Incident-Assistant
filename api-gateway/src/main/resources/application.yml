server:
  port: 8080

spring:
  application:
    name: gateway-service

  main:
    web-application-type: reactive

#  data:
#    redis:
#      host: ${REDIS_HOST:localhost}
#      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:devinsight_super_secret_jwt_key_2026_at_least_32_characters_long!}
  expiration: 86400000

internal:
  api-key: ${INTERNAL_API_KEY:devinsight_internal_ml_key_secret_12345}

gateway:
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  log-service-url: ${LOG_SERVICE_URL:http://localhost:8082}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    reactor.netty: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
