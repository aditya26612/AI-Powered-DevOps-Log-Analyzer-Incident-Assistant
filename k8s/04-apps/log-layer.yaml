apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-layer
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: log-layer
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: log-layer
  template:
    metadata:
      labels:
        app: log-layer
        app.kubernetes.io/name: devinsight
        app.kubernetes.io/component: log-layer
    spec:
      containers:
        - name: log-layer
          image: adityagoku12/devinsight-log-layer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: DB_HOST
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devinsight-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devinsight-secrets
                  key: JWT_SECRET
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devinsight-secrets
                  key: INTERNAL_API_KEY
            - name: ML_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: ML_SERVICE_URL
            - name: LLM_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: LLM_SERVICE_URL
            - name: NOTIFICATION_AUTO_DIAGNOSE
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: NOTIFICATION_AUTO_DIAGNOSE
            - name: NOTIFICATION_SLACK_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: NOTIFICATION_SLACK_ENABLED
            - name: NOTIFICATION_SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: devinsight-secrets
                  key: NOTIFICATION_SLACK_WEBHOOK_URL
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: log-layer
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: log-layer
spec:
  type: ClusterIP
  selector:
    app: log-layer
  ports:
    - name: http
      port: 8082
      targetPort: 8082

