apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-layer
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: log-layer
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: log-layer
  template:
    metadata:
      labels:
        app: log-layer
        app.kubernetes.io/name: devinsight
        app.kubernetes.io/component: log-layer
    spec:
      automountServiceAccountToken: false
      containers:
        - name: log-layer
          image: devinsight/log-layer:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: DB_HOST
            - name: LOG_LAYER_DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: LOG_LAYER_DB_USERNAME
            - name: LOG_LAYER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devinsight-secrets
                  key: LOG_LAYER_DB_PASSWORD
            - name: SLACK_WEBHOOK_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: devinsight-secrets
                  key: SLACK_WEBHOOK_ENCRYPTION_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devinsight-secrets
                  key: JWT_SECRET
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devinsight-secrets
                  key: INTERNAL_API_KEY
            - name: ML_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: ML_SERVICE_URL
            - name: LLM_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: LLM_SERVICE_URL
            - name: LLM_SERVICE_TIMEOUT
              value: "240s"
            - name: DIAGNOSIS_TIMEOUT
              value: "255s"
            - name: DIAGNOSIS_WORKERS
              value: "1"
            - name: NOTIFICATION_AUTO_DIAGNOSE
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: NOTIFICATION_AUTO_DIAGNOSE
            - name: NOTIFICATION_SLACK_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: NOTIFICATION_SLACK_ENABLED
            - name: NOTIFICATION_EMAIL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: NOTIFICATION_EMAIL_ENABLED
            - name: NOTIFICATION_DELIVERY_TRANSPORT
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: NOTIFICATION_DELIVERY_TRANSPORT
            - name: DEVINSIGHT_KAFKA_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: DEVINSIGHT_KAFKA_ENABLED
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            periodSeconds: 10
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: log-layer
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: log-layer
spec:
  type: ClusterIP
  selector:
    app: log-layer
  ports:
    - name: http
      port: 8082
      targetPort: 8082

