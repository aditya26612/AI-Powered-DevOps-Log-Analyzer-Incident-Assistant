apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: api-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/name: devinsight
        app.kubernetes.io/component: api-gateway
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api-gateway
          image: devinsight/api-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: USER_SERVICE_URL
            - name: LOG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: LOG_SERVICE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devinsight-secrets
                  key: JWT_SECRET
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devinsight-secrets
                  key: INTERNAL_API_KEY
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080

