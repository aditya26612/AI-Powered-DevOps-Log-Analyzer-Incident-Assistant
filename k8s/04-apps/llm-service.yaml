apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-service
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: llm-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: llm-service
  template:
    metadata:
      labels:
        app: llm-service
        app.kubernetes.io/name: devinsight
        app.kubernetes.io/component: llm-service
    spec:
      containers:
        - name: llm-service
          image: adityagoku12/devinsight-llm-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              name: http
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: DB_HOST
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devinsight-secrets
                  key: DB_PASSWORD
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: OLLAMA_BASE_URL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 45
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: llm-service
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: llm-service
spec:
  type: ClusterIP
  selector:
    app: llm-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
