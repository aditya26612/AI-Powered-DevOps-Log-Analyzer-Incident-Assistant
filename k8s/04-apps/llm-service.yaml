apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-service
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: llm-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: llm-service
  template:
    metadata:
      labels:
        app: llm-service
        app.kubernetes.io/name: devinsight
        app.kubernetes.io/component: llm-service
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-ollama-models
          image: ollama/ollama:0.17.1
          env:
            - name: OLLAMA_HOST
              value: http://ollama:11434
          command:
            - /bin/sh
            - -ec
            - |
              for attempt in $(seq 1 180); do
                if ollama show phi3:mini >/dev/null 2>&1 && ollama show nomic-embed-text:latest >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 5
              done
              echo "Required Ollama models are unavailable" >&2
              exit 1
      containers:
        - name: llm-service
          image: devinsight/llm-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              name: http
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: DB_HOST
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devinsight-secrets
                  key: DB_PASSWORD
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: OLLAMA_BASE_URL
            - name: RAG_VECTOR_STORE
              value: "postgres"
            - name: SPRING_AI_OLLAMA_CHAT_OPTIONS_NUMPREDICT
              value: "256"
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devinsight-secrets
                  key: INTERNAL_API_KEY
            - name: RAG_SYNCHRONIZE_ON_START
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: RAG_SYNCHRONIZE_ON_START
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 10
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: llm-service
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: llm-service
spec:
  type: ClusterIP
  selector:
    app: llm-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084

