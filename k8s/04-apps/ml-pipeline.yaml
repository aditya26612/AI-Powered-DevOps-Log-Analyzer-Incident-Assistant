apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-pipeline
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: ml-pipeline
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: ml-pipeline
  template:
    metadata:
      labels:
        app: ml-pipeline
        app.kubernetes.io/name: devinsight
        app.kubernetes.io/component: ml-pipeline
    spec:
      containers:
        - name: ml-pipeline
          image: adityagoku12/devinsight-ml-pipeline:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devinsight-secrets
                  key: INTERNAL_API_KEY
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: ENVIRONMENT
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /api/v1/system/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/system/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: ml-pipeline
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: ml-pipeline
spec:
  type: ClusterIP
  selector:
    app: ml-pipeline
  ports:
    - name: http
      port: 8000
      targetPort: 8000
