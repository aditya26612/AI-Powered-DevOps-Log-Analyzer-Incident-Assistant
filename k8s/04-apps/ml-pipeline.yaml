apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-pipeline
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: ml-pipeline
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: ml-pipeline
  template:
    metadata:
      labels:
        app: ml-pipeline
        app.kubernetes.io/name: devinsight
        app.kubernetes.io/component: ml-pipeline
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ml-pipeline
          image: devinsight/ml-pipeline:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devinsight-secrets
                  key: INTERNAL_API_KEY
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: ENVIRONMENT
            - name: ACTIVE_MODEL
              valueFrom:
                configMapKeyRef:
                  name: devinsight-config
                  key: ACTIVE_MODEL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /api/v1/system/health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/v1/system/health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/system/health
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: ml-pipeline
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: ml-pipeline
spec:
  type: ClusterIP
  selector:
    app: ml-pipeline
  ports:
    - name: http
      port: 8000
      targetPort: 8000

