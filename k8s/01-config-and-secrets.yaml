apiVersion: v1
kind: ConfigMap
metadata:
  name: devinsight-config
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: config
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  POSTGRES_USER: "postgres"
  OLLAMA_BASE_URL: "http://ollama:11434"
  ML_SERVICE_URL: "http://ml-pipeline:8000"
  LLM_SERVICE_URL: "http://llm-service:8084"
  USER_SERVICE_URL: "http://user-service:8081"
  LOG_SERVICE_URL: "http://log-layer:8082"
  ENVIRONMENT: "production"
  NOTIFICATION_AUTO_DIAGNOSE: "true"
  NOTIFICATION_SLACK_ENABLED: "false"

---
apiVersion: v1
kind: Secret
metadata:
  name: devinsight-secrets
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  DB_PASSWORD: "postgres"
  JWT_SECRET: "devinsight_super_secret_jwt_key_2026_at_least_32_characters_long!"
  INTERNAL_API_KEY: "devinsight_internal_ml_key_secret_12345"
  NOTIFICATION_SLACK_WEBHOOK_URL: ""

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: database-init
data:
  init-db.sql: |
    CREATE DATABASE devinsight;
    CREATE DATABASE log_layer_db;
    CREATE DATABASE llm_service_db;

