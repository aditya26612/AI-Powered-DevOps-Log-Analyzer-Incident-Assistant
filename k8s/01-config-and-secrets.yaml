apiVersion: v1
kind: ConfigMap
metadata:
  name: devinsight-config
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: config
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  POSTGRES_USER: "postgres"
  OLLAMA_BASE_URL: "http://ollama:11434"
  ML_SERVICE_URL: "http://ml-pipeline:8000"
  LLM_SERVICE_URL: "http://llm-service:8084"
  USER_SERVICE_URL: "http://user-service:8081"
  LOG_SERVICE_URL: "http://log-layer:8082"
  ENVIRONMENT: "production"
  NOTIFICATION_AUTO_DIAGNOSE: "true"
  NOTIFICATION_SLACK_ENABLED: "true"

---
apiVersion: v1
kind: Secret
metadata:
  name: devinsight-secrets
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: secrets
type: Opaque
# Replace these placeholders in a private deployment copy.
stringData:
  DB_PASSWORD: "replace-with-db-password"
  JWT_SECRET: "replace-with-a-random-jwt-signing-secret"
  INTERNAL_API_KEY: "replace-with-a-random-internal-api-key"
  NOTIFICATION_SLACK_WEBHOOK_URL: ""

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: database-init
data:
  init-db.sql: |
    CREATE DATABASE devinsight;
    CREATE DATABASE log_layer_db;
    CREATE DATABASE llm_service_db;

