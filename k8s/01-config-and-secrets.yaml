apiVersion: v1
kind: ConfigMap
metadata:
  name: devinsight-config
  namespace: devinsight
  labels:
    app.kubernetes.io/name: devinsight
    app.kubernetes.io/component: config
data:
  DB_HOST: "postgres"
  POSTGRES_USER: "postgres"
  OLLAMA_BASE_URL: "http://ollama:11434"
  ML_SERVICE_URL: "http://ml-pipeline:8000"
  LLM_SERVICE_URL: "http://llm-service:8084"
  USER_SERVICE_URL: "http://user-service:8081"
  LOG_SERVICE_URL: "http://log-layer:8082"
  ENVIRONMENT: "production"
  ACTIVE_MODEL: "v2"
  LOG_LAYER_DB_USERNAME: "devinsight_log_app"
  DEVINSIGHT_KAFKA_ENABLED: "false"
  RAG_SYNCHRONIZE_ON_START: "false"
  NOTIFICATION_EMAIL_ENABLED: "false"
  NOTIFICATION_DELIVERY_TRANSPORT: "OFF"
  NOTIFICATION_AUTO_DIAGNOSE: "true"
  NOTIFICATION_SLACK_ENABLED: "false"


---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: devinsight
data:
  init-db.sql: |
    -- ==============================================================================
    -- DevInsight Multi-Database & Vector Store Initialization
    -- ==============================================================================

    -- 1. Create databases for microservices
    CREATE DATABASE devinsight;
    CREATE DATABASE log_layer_db;
    CREATE DATABASE llm_service_db;

    -- 2. Configure pgvector and RAG Knowledge Base in llm_service_db
    \c llm_service_db;

    CREATE EXTENSION IF NOT EXISTS vector;

    CREATE TABLE IF NOT EXISTS knowledge_chunks (
        id BIGSERIAL PRIMARY KEY,
        document_id VARCHAR(255) NOT NULL UNIQUE,
        content TEXT NOT NULL,
        metadata JSONB,
        embedding vector(768) NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_knowledge_chunks_embedding
        ON knowledge_chunks USING hnsw (embedding vector_cosine_ops);

    CREATE INDEX IF NOT EXISTS idx_knowledge_chunks_doc_id
        ON knowledge_chunks (document_id);
