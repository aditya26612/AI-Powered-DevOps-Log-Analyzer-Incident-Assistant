server:
  port: 8084

spring:
  application:
    name: llm-service

  datasource:
    url: jdbc:postgresql://localhost:5432/llm_service_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
#    username: postgres
#    password: 2005

    driver-class-name: org.postgresql.Driver

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: phi3:mini
          temperature: 0.2
          format: json
      embedding:
        options:
          model: nomic-embed-text:latest

management:
  endpoints:
    web:
      exposure:
        include: health, info

  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.project.llmservice: DEBUG

llm:
  provider: OLLAMA

# prompt:
#   max-context-length: 8000

# response:
#   max-tokens: 512

# timeout:
#   seconds: 60

rag:
  vector-store: postgres
  retrieval:
    similarity-threshold: 0.65
