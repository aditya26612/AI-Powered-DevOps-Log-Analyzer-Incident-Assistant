# Use with -f docker-compose.yml -f docker-compose.prod.yml.
# Registry images must be built from this revision.
x-registry-runtime: &registry-runtime
  build: !reset null
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  ml-pipeline:
    <<: *registry-runtime
    image: ${DOCKER_REGISTRY_USER:?Set DOCKER_REGISTRY_USER}/devinsight-ml-pipeline:${IMAGE_TAG:?Set IMAGE_TAG}
  user-service:
    <<: *registry-runtime
    image: ${DOCKER_REGISTRY_USER:?Set DOCKER_REGISTRY_USER}/devinsight-user-service:${IMAGE_TAG:?Set IMAGE_TAG}
  llm-service:
    <<: *registry-runtime
    image: ${DOCKER_REGISTRY_USER:?Set DOCKER_REGISTRY_USER}/devinsight-llm-service:${IMAGE_TAG:?Set IMAGE_TAG}
  log-layer:
    <<: *registry-runtime
    image: ${DOCKER_REGISTRY_USER:?Set DOCKER_REGISTRY_USER}/devinsight-log-layer:${IMAGE_TAG:?Set IMAGE_TAG}
  api-gateway:
    <<: *registry-runtime
    image: ${DOCKER_REGISTRY_USER:?Set DOCKER_REGISTRY_USER}/devinsight-api-gateway:${IMAGE_TAG:?Set IMAGE_TAG}
  frontend:
    <<: *registry-runtime
    image: ${DOCKER_REGISTRY_USER:?Set DOCKER_REGISTRY_USER}/devinsight-frontend:${IMAGE_TAG:?Set IMAGE_TAG}

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-devinsight}-postgres-registry
  ollama_data:
    name: ${COMPOSE_PROJECT_NAME:-devinsight}-ollama-registry
